# Ensures packages test correctly
name: Test Packages

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

jobs:
  test:
    name: Test Packages
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        mysql-version: [ 8.0, 8.4 ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          repository: journeyapps-platform/ci-actions
          token: ${{ secrets.SHARED_GH_TOKEN }}
          path: .github/ci
          ref: v1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Enable Corepack
        run: |
          pnpm install -g corepack@latest
          corepack enable pnpm

      - name: Start MySQL
        run: |
          docker run \
          --name zongji_test \
          -e MYSQL_ROOT_PASSWORD=my_password \
          -p 3306:3306 \
          -d mysql:${{ matrix.mysql-version }} \
          --log-bin=/var/lib/mysql/mysql-bin.log

      - name: Install dependencies
        run: pnpm install

      - name: Test
        run: pnpm test
